[package]
name = "legal-job-dead-letter"
version = "0.1.0"
edition = "2021"

[dependencies]
httpdate = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "queue-worker"
path = "src/main.rs"
